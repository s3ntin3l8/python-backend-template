[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-name"
version = "0.1.1" # x-release-please-version
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlmodel==0.0.50",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"` (and the ci-python reusable workflow) install these so
# linting, typing, tests, coverage, audit, and secret scanning actually run.
dev = [
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "detect-secrets>=1.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "N", "S", "B", "A", "C4", "DTZ", "SIM", "RET", "ARG", "ERA", "PL"]
ignore = [
    "S101",    # Use of assert
    "RET504",  # Unnecessary assignment before return
    "B008",    # Do not perform function call `Depends` in argument defaults
    "S105",    # Possible hardcoded password
    "PLR2004", # Magic value used in comparison
    "PLC0415", # import should be at the top-level
    "B904",    # raise ... from err
]

[tool.ruff.lint.pylint]
max-args = 10
max-statements = 75

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "F841", "SIM", "DTZ", "PLR", "S", "B018"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false
